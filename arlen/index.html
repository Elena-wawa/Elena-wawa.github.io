<!DOCTYPE HTML>
<html>
<head>
<style>
  img {
    width: 100%;
    height: auto;
  body {
  background: #fa64b4;
background: linear-gradient(90deg,rgba(250, 100, 180, 1) 0%, rgba(156, 226, 247, 1) 50%, rgba(131, 66, 252, 1) 100%);
  }
p {
  text-align: center;
  font-size: 60px;
  margin-top: 0px;
}
</style>
</head>
<body>

<p id="dih"></p>

<script>
// Set the date we're counting down to
var countDownDate = new Date("Mar 26, 2028 19:37:30").getTime();
// Update the count down every 1 second
var x = setInterval(function() {

  // Get today's date and time
  var now = new Date().getTime();
    
  // Find the distance between now and the count down date
  var distance = countDownDate - now;
    // Time calculations for days, hours, minutes and seconds
  var days = Math.floor(distance / (1000 * 60 * 60 * 24));
  var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  var seconds = Math.floor((distance % (1000 * 60)) / 1000);
  // Output the result in an element with id="demo"
   document.getElementById("dih").innerHTML = days + "d " + hours + "h "
  + minutes + "m " + seconds + "s ";
  if (distance < 0) {
    clearInterval(x);
    document.getElementById("demo").innerHTML = "NOW";
  }
}, 1000);
</script>
<p>DAYS UNTIL ARLEN MAID PIC</p>
<img src="Screenshot_20260327_071724_Discord.jpg" alt="proof">
</body>
</html>
